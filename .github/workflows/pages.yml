name: pages

# Pages source is set to "GitHub Actions" in the repository settings, so the site has to be
# deployed by a workflow — selecting that source does not publish anything on its own.
# The published root is probe-delivery/ so that index.html and heic_two_frames.heic sit next
# to each other and the relative og:image resolves.

on:
  push:
    branches: ["**"]
    paths:
      - "probe-delivery/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r probe-delivery/. _site/
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
