name: build-ipa

# Every push builds a fresh unsigned arm64 IPA and keeps a stable download URL at:
#   https://github.com/<owner>/<repo>/releases/download/latest-build/Cinder27-unsigned.ipa
# The IPA is deliberately unsigned — sign it with your own certificate plus a matching
# (or wildcard) provisioning profile before sideloading.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The image carries several Xcodes (16.0 … 26.x). The oldest one is what a naive glob
      # picks, and its Swift 6.0 solver cannot type-check the module tables in Sources/ —
      # "unable to type-check this expression in reasonable time". Pick the newest iOS SDK
      # instead: Swift 6.2 rewrote that part of the type checker, and 26.x matches the SDK
      # the sources were written against.
      - name: Select the newest Xcode with the iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/xcodes.txt
          echo "candidates:"
          for candidate in /Applications/Xcode*.app; do
            dev="$candidate/Contents/Developer"
            [ -d "$dev/Platforms/iPhoneOS.platform" ] || continue
            sdk=$(DEVELOPER_DIR="$dev" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo 0.0)
            printf '  %-46s iOS SDK %s\n' "$candidate" "$sdk"
            echo "$sdk|$dev" >> /tmp/xcodes.txt
          done
          if [ ! -s /tmp/xcodes.txt ]; then
            echo "no Xcode with an iPhoneOS platform found" >&2
            exit 1
          fi
          best=$(awk -F'|' '{ split($1,v,"."); k=v[1]*10000+v[2]*100+v[3]; if (k >= m) { m=k; d=$2 } } END { print d }' /tmp/xcodes.txt)
          sudo xcode-select -s "$best"
          echo "selected: $best"
          xcodebuild -version
          swiftc --version
          echo "sdk: $(xcrun --sdk iphoneos --show-sdk-version)"
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build unsigned IPA
        shell: bash
        # The module closures in Sources/ are large and several of them are a single
        # expression carrying many `String +` chains. Swift's constraint solver gives up
        # after its default per-expression budget with "unable to type-check this
        # expression in reasonable time". The frontend option that controls that budget is
        # -solver-expression-time-threshold=<seconds>; raise it rather than weakening the
        # sources further.
        env:
          EXTRA_SWIFT_FLAGS: "-Xfrontend -solver-expression-time-threshold=120"
        run: bash scripts/build-device.sh

      - name: Verify the IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA=dist/Cinder27-unsigned.ipa
          test -f "$IPA"
          python3 - "$IPA" <<'PY'
          import sys, zipfile

          path = sys.argv[1]
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              required = [
                  "Payload/Cinder27.app/Cinder27",
                  "Payload/Cinder27.app/Info.plist",
                  "Payload/Cinder27.app/PkgInfo",
              ]
              missing = [n for n in required if n not in names]
              if missing:
                  raise SystemExit("IPA is missing entries: %s" % missing)
              info = z.read("Payload/Cinder27.app/Info.plist")
              binary = z.read("Payload/Cinder27.app/Cinder27")
          print("entries:", len(names))
          print("binary:", len(binary), "bytes")
          print("CFBundleIdentifier in Info.plist:", b"com.jbjf.cinder27" in info)
          if b"com.jbjf.cinder27" not in info:
              raise SystemExit("Info.plist does not carry the expected bundle id")
          if binary[0:4] != b"\xcf\xfa\xed\xfe":
              raise SystemExit("main binary is not a thin arm64 Mach-O")
          PY

      - name: Report artifact size
        run: ls -lh dist/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cinder27-unsigned-ipa
          path: dist/Cinder27-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      # A single rolling release gives one stable URL that always serves the newest build —
      # far easier to grab from a phone than an artifact that needs a signed-in browser.
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Cinder27 — latest build
          body: |
            Unsigned arm64 IPA.

            - built from `${{ github.sha }}`
            - run #${{ github.run_number }}, ${{ runner.os }}
            - deployment target iOS 17.0

            Deliberately unsigned: sign it with your own certificate and a matching
            provisioning profile before sideloading.
          files: dist/Cinder27-unsigned.ipa
          fail_on_unmatched_files: true
